# Photo Finder's web server: Apache httpd 2.4 (Apache Lounge Win64 build) with PHP as a module.
#
# Started by silent-server.vbs (and start.bat), which set these environment variables first:
#   PF_APP   the program folder, forward slashes   (e.g. C:/Program Files/Photo Finder)
#   PF_DATA  the data folder, forward slashes      (e.g. C:/Users/you/AppData/Local/Photo Finder)
#   PF_PORT  the port, normally 8765
# The program folder is read-only (Program Files); everything Apache writes goes to PF_DATA.
#
# Why Apache and not PHP's built-in server (php -S): on real PCs (Edge with Avast's web shield,
# seen 2026-11-26) the built-in server's responses over ~70 KB stalled in the browser, so the
# photo grid and full-size photos never loaded. The same responses from Apache never stalled.

ServerRoot "${PF_APP}/apache"
Listen 127.0.0.1:${PF_PORT}
ServerName 127.0.0.1:${PF_PORT}
ServerTokens Prod
ServerSignature Off
TraceEnable Off

DefaultRuntimeDir "${PF_DATA}"
PidFile "${PF_DATA}/httpd.pid"
ErrorLog "${PF_DATA}/server.log"
LogLevel warn

# One child process with a thread pool (mpm_winnt). A local app needs few threads.
ThreadsPerChild 16
MaxConnectionsPerChild 0
# Scans and other long actions run inside one request.
Timeout 600
KeepAlive On
KeepAliveTimeout 15
MaxKeepAliveRequests 1000
# Windows: plain accept() and no sendfile/mmap. Network filters (antivirus web shields) and
# OneDrive placeholders are both less trouble that way.
AcceptFilter http none
EnableSendfile Off
EnableMMAP Off

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule php_module "${PF_APP}/php/php8apache2_4.dll"
PHPIniDir "${PF_APP}/php"

# The app's code decides where its data lives from this (see pf_data_dir() in lib/util.php).
SetEnv PHOTOFINDER_DATA "${PF_DATA}"
# Every request passes the same checks first (host, same-origin), see guard.php.
php_value auto_prepend_file "${PF_APP}/guard.php"

# Compress the page and API responses (the photo list is ~75 KB of JSON).
AddOutputFilterByType DEFLATE text/html text/plain application/json

DocumentRoot "${PF_APP}"
DirectoryIndex index.php

<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

# Only the app's four entry points are reachable. data, lib, php, bin, apache and the
# maintenance scripts never are.
<Directory "${PF_APP}">
    Options None
    AllowOverride None
    <Files ~ "^(index|api|file|thumb)\.php$">
        SetHandler application/x-httpd-php
        Require all granted
    </Files>
</Directory>
<LocationMatch "^/$">
    Require all granted
</LocationMatch>
