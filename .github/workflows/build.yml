name: Build installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used on version tags, to create the draft release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # The build starts the bundled Apache once to test it. It is built with Visual Studio
      # 2026 and needs the VC++ runtime 14.50 or later, which the runner image may not have yet.
      - name: Update the Microsoft VC++ runtime
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
          Invoke-WebRequest https://aka.ms/vc14/vc_redist.x64.exe -OutFile $f
          $s = Get-AuthenticodeSignature $f
          if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw "vc_redist signature: $($s.Status)" }
          $p = Start-Process $f -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          if ($p.ExitCode -notin 0, 1638, 3010) { throw "vc_redist exit $($p.ExitCode)" }
          (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64').Version

      - name: Build installer
        shell: pwsh
        run: ./build.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/PhotoFinderSetup-*.exe
          if-no-files-found: error

      - name: Draft release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @((Get-ChildItem dist -Filter 'PhotoFinderSetup-*.exe').FullName)
          if (-not $files) { throw 'no installer to release' }
          $assets = @()
          foreach ($f in $files) {
            (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + '  ' + (Split-Path -Leaf $f) | Set-Content "$f.sha256" -NoNewline
            $assets += $f, "$f.sha256"
          }
          $base = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/main/README.md"
          $sig = "The installer is not code-signed, so Windows may warn that it doesn't know the publisher: see [Windows warnings when installing]($base#windows-warnings-when-installing)."
          $notes = "Photo Finder searches your Windows photo library by what is in the photos. See the [README]($base) for features and requirements.`n`n$sig`n`n[Privacy]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/main/PRIVACY.md)"
          gh release create $env:GITHUB_REF_NAME --draft --title "Photo Finder $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes $notes $assets
